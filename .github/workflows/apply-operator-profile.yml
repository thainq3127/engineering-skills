name: Apply operator profile patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/operator-profile.patch.part-* > /tmp/operator-profile.patch
          git apply --check /tmp/operator-profile.patch
          git apply /tmp/operator-profile.patch
          node scripts/validate-skills.mjs
          git diff --check

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/operator-profile.patch.part-*
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/apply-operator-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock tools to Workstream operator profiles"
          git push origin HEAD:main
